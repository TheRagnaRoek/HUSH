[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hush"
version = "1.1.0"
description = "HUSH - Human genome Universal Silencing Hairpin-designer: a modern, allele-aware siRNA/shRNA design pipeline for polymorphic gene families"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "HUSH contributors" }]
keywords = ["siRNA", "shRNA", "RNAi", "HLA", "bioinformatics", "gene-silencing"]

dependencies = [
    "biopython>=1.83",
    # Not imported directly, but Biopython requires it and its PairwiseAligner
    # returns numpy arrays, so it is part of the runtime surface regardless.
    "numpy>=1.26",
    "typer>=0.12",
]

[project.optional-dependencies]
# The HTTP API is an optional extra: the core library, CLI and tests never need
# it. Install with ".[api]" (or ".[dev,api]") to run the FastAPI backend.
api = ["fastapi>=0.110", "uvicorn>=0.29"]
# The MCP server is an optional extra too. It needs the 2.x "mcp" API
# (mcp.server.mcpserver); see requirements-mcp.txt for the tested pins.
mcp = ["mcp>=2.3,<3"]
# starlette's TestClient moved to httpx2; httpx alone fails collection on a
# current starlette, so pin the one the test client actually imports.
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx2>=2.13", "ruff>=0.6"]

[project.scripts]
hush = "app.cli:app"

[tool.setuptools]
# Flat top-level packages mirroring the pipeline stages, plus the service layer
# (the orchestration layer used by the CLI and the API) and the HTTP API.
# mcp/ is deliberately absent: a top-level "mcp" package would shadow the PyPI
# "mcp" that the server imports. The server runs as a script instead.
packages = ["core", "msa", "shrna", "service", "app", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# ruff's defaults are E4 (imports), E7/E9 (statement and syntax errors) and F
# (pyflakes). E501 is not among them - without it line-length above would only
# steer `ruff format`, which is not run here, so long lines would pass the gate.
select = ["E4", "E7", "E9", "F", "E501"]
