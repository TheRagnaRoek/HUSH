[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hush"
version = "0.0.1"
description = "HUSH - Human genome Universal Silencing Hairpin-designer: a modern, allele-aware siRNA/shRNA design pipeline for polymorphic gene families"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "HUSH contributors" }]
keywords = ["siRNA", "shRNA", "RNAi", "HLA", "bioinformatics", "gene-silencing"]

dependencies = [
    "biopython>=1.83",
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
hush = "app.cli:app"

[tool.setuptools]
# Flat top-level packages mirroring the pipeline stages, plus the service layer
# (the orchestration seam the CLI and API render over).
packages = ["core", "msa", "shrna", "service", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
