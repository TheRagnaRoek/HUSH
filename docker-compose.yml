# HUSH, built from this checkout and run locally.
#
#   docker compose run --rm reference-build   # once: fetch the RefSeq reference
#   docker compose up --build hush            # then: GUI + API on :8000
#
# Both services share the `hush_ref` volume, so the reference is built once and
# every later run finds it automatically. Compose only builds when the image tag
# is missing, so pass --build after pulling new code. Set HUSH_IMAGE to run a
# published image instead, e.g. ghcr.io/theragnaroek/hush:1.1.0.
services:
  # The GUI and API on one port. Open http://localhost:8000 once it is up.
  hush:
    image: ${HUSH_IMAGE:-hush:local}
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - hush_ref:/data/reference
      # Designs you save land in ./work on the host.
      - ./work:/work
    restart: unless-stopped

  # One-shot reference build: fetch the RefSeq human transcriptome and run
  # bowtie-build into the shared volume. Several GB, and needs a network.
  reference-build:
    image: ${HUSH_IMAGE:-hush:local}
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - hush_ref:/data/reference
    command: ["hush", "reference", "build"]

volumes:
  hush_ref:
